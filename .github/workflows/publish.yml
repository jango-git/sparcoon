name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Trusted publishing: npm checks this run's OIDC token instead of a stored npm token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npx eslint src tests
      - run: npx tsc --noEmit -p tests/tsconfig.json
      - run: npm test
      # prepublishOnly builds dist.
      - run: npm publish
