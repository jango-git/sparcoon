name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint src tests
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tests/tsconfig.json
      - run: npm test
